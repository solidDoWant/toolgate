# toolgate's own settings. Most installs change only this block.
config:
  # -- Number of gateway pods. Every replica serves requests; one at a time
  # holds the leader Lease and runs the runtime reconciler.
  replicas: 2

  image:
    # -- Gateway image repository.
    repository: ghcr.io/soliddowant/toolgate
    # -- Image tag. Empty means the chart's `appVersion`.
    tag: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent

  # -- Secrets that hold credentials for pulling the image, as a list of
  # `{name: ...}` objects.
  imagePullSecrets: []

  database:
    # -- Name of an existing Secret in the release namespace that holds the
    # PostgreSQL connection string. Required.
    existingSecret: ""
    # -- Key in `config.database.existingSecret` that holds the connection
    # string.
    secretKey: url
    # -- Whether the gateway creates and updates its tables when it starts.
    # Set false when the gateway's database user has data rights only. Then
    # run the migrations with `config.database.migrationSecret`, or run
    # `toolgate migrate` yourself.
    migrateOnStart: true
    # -- Name of an existing Secret in the release namespace that holds the
    # connection string of the database role that owns the tables. When it is
    # set and `config.database.migrateOnStart` is false, a Helm hook Job runs
    # `toolgate migrate` with it before every install and upgrade. Hooks need
    # Helm or Flux: `helm template | kubectl apply` skips them.
    migrationSecret: ""
    # -- Key in `config.database.migrationSecret` that holds the connection
    # string.
    migrationSecretKey: url
    # -- Egress rules (the `egress` list of a Kubernetes `NetworkPolicy`) that
    # let the migration Job reach PostgreSQL. Required when the Job renders.
    # The chart adds DNS (port 53) itself.
    migrationEgress: []

  oidc:
    # -- Issuer URL of the OIDC identity provider that users sign in with,
    # such as `https://idp.example.com/realms/main`. Required.
    issuerURL: ""
    # -- (string or list) Audiences that users' access tokens may be for: one value such as
    # `toolgate`, or a list of 1 to 8 such as `[toolgate, coder-toolgate]`.
    # Each is the client ID of a client at `config.oidc.issuerURL`.
    # Required. The gateway accepts access tokens of every listed client, so
    # list only clients made for toolgate.
    audience: ""
    # -- Access token claim that holds the user's email address. Empty means
    # the gateway's default, `email`.
    emailClaim: ""
    # -- Access token claim that tells whether the identity provider verified
    # the email address. Empty means the gateway's default, `email_verified`.
    emailVerifiedClaim: ""
    # -- Access token claim that holds the user's groups. Empty means the
    # gateway's default, `groups`.
    groupsClaim: ""

  ui:
    # -- URL where users open the gateway in a browser, such as
    # `https://toolgate.example.com`. Required when `config.ui.clientID` is
    # set. It must be `https://`.
    publicURL: ""
    # -- OIDC client ID of the web UI. The web UI is on only when this is
    # set. The identity provider must allow the redirect URI
    # `config.ui.publicURL` + `/ui/auth/callback`.
    clientID: ""
    # -- Path of a file that holds the web UI client's secret, mounted from a
    # Secret with `persistence`. Empty means a public client.
    clientSecretFile: ""
    # -- Scopes the web UI asks for at sign-in. Empty means the gateway's
    # default, `openid email profile`.
    scopes: []
    # -- Group whose members are web UI admins. Empty means nobody is an
    # admin.
    adminGroup: ""
    # -- How long a call that needs approval waits for a person, and how long
    # an approved request stays usable, as a Go duration from `1m` to `1h`.
    approvalTimeout: 10m

  # -- Namespaces whose `MCPServerTemplate` and `ToolgateRule` objects the
  # gateway reads, such as `[toolgate-catalog]`. Empty means the release
  # namespace.
  catalogNamespaces: []

  logging:
    # -- Lowest level of the JSON log lines: `debug`, `info`, `warn` or
    # `error`.
    level: info

  # -- OTLP/HTTP endpoint for the gateway's traces, such as
  # `http://otel-collector:4318`. Empty turns trace export off.
  otlpEndpoint: ""

  # -- How long a session can go without requests before the gateway ends it
  # and stops its per-session MCP servers, as a Go duration such as `2h`.
  sessionIdleTimeout: 2h

  # -- How long the gateway keeps the list of enabled servers of an ended
  # session, as a Go duration from `1h` to `168h` (7 days).
  sessionResumeWindow: 24h

  limits:
    # -- Maximum number of MCP server instances that run for one user at the
    # same time. Per-session and per-user instances count for the user who
    # started them. Shared instances do not count. At least 1.
    instancesPerUser: 20
    # -- Maximum number of MCP server instances that the gateway runs at the
    # same time, for all users and shared instances together. At least 1.
    instances: 200

  audit:
    # -- Store audit payloads: the arguments of each tool call and approval
    # request, and each tool result. Payloads under 64 KiB go in PostgreSQL,
    # larger ones in the S3 bucket. If true, `config.audit.s3.bucket` is
    # required.
    payloads: false
    s3:
      # -- URL of the S3 API, such as `https://s3.example.com`. Empty means
      # the AWS S3 endpoint of `config.audit.s3.region`.
      endpoint: ""
      # -- S3 region of the bucket, such as `us-east-1`.
      region: ""
      # -- S3 bucket for large audit payloads. Required when
      # `config.audit.payloads` is true.
      bucket: ""
      # -- Prefix of the payload object keys, such as `toolgate/`.
      prefix: ""
      # -- Put the bucket name in the URL path instead of the host name.
      # Many S3-compatible servers need true.
      pathStyle: false
      # -- Name of an existing Secret in the release namespace with the S3
      # access key. Empty means the gateway uses the other credential sources
      # of the AWS SDK, such as a web identity token.
      existingSecret: ""
      # -- Key in `config.audit.s3.existingSecret` that holds the access key
      # ID.
      accessKeyIDKey: accessKeyID
      # -- Key in `config.audit.s3.existingSecret` that holds the secret
      # access key.
      secretAccessKeyKey: secretAccessKey

  # -- Resolvers: HTTP services a template's `${resolver:<name>}` gets a
  # value from. Each item has a `name`, an `https://` `url`, an `audience`,
  # an optional `timeout` (default `10s`, at most `60s`) and an optional
  # `caFile`. The chart writes them to the gateway's configuration file and
  # mounts a service-account token with each resolver's audience at
  # `/var/run/secrets/toolgate/resolvers/<name>/token`. Mount a `caFile`
  # with `resources.persistence`.
  resolvers: []

  spiffe:
    # -- SPIFFE trust domains whose JWT-SVIDs may sign in, attested as the
    # workload. Each item has a `name` (the trust domain), exactly one of
    # `bundleEndpointURL` (a SPIFFE bundle endpoint with the `https_web`
    # profile) and `jwksURL` (a JWKS document, such as that of SPIRE's OIDC
    # discovery provider), both `https://`, and an optional `caFile`. The
    # chart writes them to the gateway's configuration file. Mount a
    # `caFile` with `resources.persistence`.
    trustDomains: []

  # -- More environment variables for the gateway container, as a list of
  # Kubernetes `EnvVar` objects.
  extraEnv: []

  serviceAccount:
    # -- Name of the gateway's service account. Empty means the release's
    # full name. The RBAC rules and the admission policy apply to this
    # account.
    name: ""

  service:
    # -- Session affinity of the gateway's Service: `None` or `ClientIP`.
    # toolgate does not need affinity to be correct. `ClientIP` makes replica
    # switches rare.
    sessionAffinity: None

  serviceMonitor:
    # -- Create a Prometheus Operator `ServiceMonitor` for the metrics
    # Service. The `ServiceMonitor` CRD must be installed.
    enabled: false

  sharedNamespace:
    # -- Name of the namespace for instances of `namespace: shared`
    # templates. Empty means the chart creates none. It must not start with
    # `tg-`.
    name: ""
    # -- Create the shared namespace with toolgate's labels. If false, the
    # namespace must exist and carry the labels
    # `toolgate.soliddowant.dev/writable: "true"` and
    # `pod-security.kubernetes.io/enforce: restricted`.
    create: true

  crds:
    # -- Install toolgate's CRDs with the chart. `helm upgrade` updates them.
    # If false, install them yourself.
    enabled: true
    # -- Keep the CRDs, and so every template, rule and settings profile,
    # when the release is uninstalled (`helm.sh/resource-policy: keep`).
    keep: true

rbac:
  # -- More RBAC rules for the gateway's ClusterRole, added after the
  # default rules. Grant each extra kind a template contains `create`,
  # `patch`, `delete`, `get`, `list` and `watch`. The admission policy still
  # confines every write to toolgate's namespaces.
  extraRules: []
  # extraRules:
  #   - apiGroups: ["helm.toolkit.fluxcd.io"]
  #     resources: ["helmreleases"]
  #     verbs: ["create", "patch", "delete", "get", "list", "watch"]

# -- The gateway's Deployment, Services, ServiceAccount, PodDisruptionBudget
# and ServiceMonitor, in the values format of the bjw-s `common` library chart
# (https://bjw-s-labs.github.io/helm-charts/docs/common-library/). Override any
# part, such as probes, affinity, resources or extra containers. String values
# can use Helm templates. The RBAC rules (see `rbac.extraRules`) and the
# admission policy are not here.
# @default -- see `values.yaml`
resources:
  defaultPodOptions:
    # The gateway talks to the Kubernetes API with its service account token.
    automountServiceAccountToken: true
    enableServiceLinks: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
  controllers:
    gateway:
      type: deployment
      replicas: "{{ .Values.config.replicas }}"
      strategy: RollingUpdate
      serviceAccount:
        identifier: gateway
      pod:
        # Spread the replicas over nodes.
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: "{{ .Chart.Name }}"
                      app.kubernetes.io/instance: "{{ .Release.Name }}"
                      app.kubernetes.io/controller: gateway
      containers:
        gateway:
          image:
            repository: "{{ .Values.config.image.repository }}"
            tag: "{{ .Values.config.image.tag | default .Chart.AppVersion }}"
            pullPolicy: "{{ .Values.config.image.pullPolicy }}"
          args:
            - serve
          # templates/common.yaml adds the gateway's settings from `config`
          # before these.
          env: []
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: http
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /readyz
                  port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The memory request equals the limit, so the pod is never killed
          # for memory a node gave to another pod. No CPU limit, so the
          # gateway is never throttled.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
    # The migration Job. It renders only when `config.database.migrationSecret`
    # is set and `config.database.migrateOnStart` is false. It mounts nothing
    # from the release, because the release's ConfigMap and Secrets don't exist
    # yet when it runs. Mount client certificates with
    # `resources.persistence.<name>.advancedMounts.migrate`.
    migrate:
      enabled: '{{ include "toolgate.migrateJobEnabled" . }}'
      type: job
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "0"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      serviceAccount:
        identifier: migrate
      job:
        backoffLimit: 2
        activeDeadlineSeconds: 240
      pod:
        restartPolicy: Never
        automountServiceAccountToken: false
      containers:
        migrate:
          image:
            repository: "{{ .Values.config.image.repository }}"
            tag: "{{ .Values.config.image.tag | default .Chart.AppVersion }}"
            pullPolicy: "{{ .Values.config.image.pullPolicy }}"
          args:
            - migrate
          env:
            - name: TOOLGATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.config.database.migrationSecret }}"
                  key: "{{ .Values.config.database.migrationSecretKey }}"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
  service:
    gateway:
      controller: gateway
      forceRename: '{{ include "toolgate.fullname" . }}'
      sessionAffinity: "{{ .Values.config.service.sessionAffinity }}"
      ports:
        http:
          port: 80
          targetPort: 8080
    metrics:
      controller: gateway
      labels:
        app.kubernetes.io/component: metrics
      ports:
        metrics:
          port: 9090
          targetPort: 9090
  serviceAccount:
    gateway:
      forceRename: '{{ include "toolgate.serviceAccountName" . }}'
    # The migration Job's service account, with no RBAC. The release's own
    # service account doesn't exist yet at install.
    migrate:
      enabled: '{{ include "toolgate.migrateJobEnabled" . }}'
      forceRename: '{{ include "toolgate.fullname" . }}-migrate'
      automountServiceAccountToken: false
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "-20"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  serviceMonitor:
    gateway:
      enabled: "{{ .Values.config.serviceMonitor.enabled }}"
      # Keep the Prometheus job label set to the service name (the library
      # defaults to the chart name).
      jobLabel: app.kubernetes.io/service
      service:
        identifier: metrics
      endpoints:
        - port: metrics
  rawResources:
    # Confines the migration Job's pods: no ingress, DNS and
    # `config.database.migrationEgress` out (templates/common.yaml adds it).
    migrate-networkpolicy:
      enabled: '{{ include "toolgate.migrateJobEnabled" . }}'
      forceRename: '{{ include "toolgate.fullname" . }}-migrate'
      manifest:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          annotations:
            helm.sh/hook: pre-install,pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
        spec:
          policyTypes: [Ingress, Egress]
          podSelector:
            matchLabels:
              app.kubernetes.io/name: "{{ .Chart.Name }}"
              app.kubernetes.io/instance: "{{ .Release.Name }}"
              app.kubernetes.io/controller: migrate
          egress:
            - ports:
                - {protocol: UDP, port: 53}
                - {protocol: TCP, port: 53}
    gateway-pdb:
      forceRename: '{{ include "toolgate.fullname" . }}'
      manifest:
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        spec:
          minAvailable: 1
          # Evicting a pod that isn't ready never lowers availability, and
          # lets node drains finish when a replica is stuck.
          unhealthyPodEvictionPolicy: AlwaysAllow
          selector:
            matchLabels:
              app.kubernetes.io/name: "{{ .Chart.Name }}"
              app.kubernetes.io/instance: "{{ .Release.Name }}"
              app.kubernetes.io/controller: gateway
