# toolgate's own settings. Most installs change only this block.
config:
  # -- Number of gateway pods. Every replica serves requests; one at a time
  # holds the leader Lease and runs the runtime reconciler.
  replicas: 2

  image:
    # -- Gateway image repository.
    repository: ghcr.io/soliddowant/toolgate
    # -- Image tag. Empty means the chart's `appVersion`.
    tag: ""
    # -- Image pull policy.
    pullPolicy: IfNotPresent

  # -- Secrets that hold credentials for pulling the image, as a list of
  # `{name: ...}` objects.
  imagePullSecrets: []

  database:
    # -- The PostgreSQL connection string, inline. Use it only for a string
    # with no password, such as client-certificate or token authentication.
    # The value ends up in the Deployment spec and in the Helm release, where
    # anyone who can read them sees it. Set exactly one of this and
    # `config.database.existingSecret`.
    url: ""
    # -- Name of an existing Secret in the release namespace that holds the
    # PostgreSQL connection string. Use it for any string with a password.
    # Set exactly one of this and `config.database.url`.
    existingSecret: ""
    # -- Key in `config.database.existingSecret` that holds the connection
    # string.
    secretKey: url
    # -- Whether the gateway creates and updates its tables when it starts.
    # Set false when the gateway's database user has data rights only. Then
    # run the migrations with `config.database.migrationSecret`, or run
    # `toolgate migrate` yourself.
    migrateOnStart: true
    # -- The connection string of the database role that owns the tables,
    # inline. Use it only for a string with no password. The value ends up in
    # the Job spec and in the Helm release. Set at most one of this and
    # `config.database.migrationSecret`; the Job renders as for the Secret.
    migrationUrl: ""
    # -- Name of an existing Secret in the release namespace that holds the
    # connection string of the database role that owns the tables. When it is
    # set and `config.database.migrateOnStart` is false, a Helm hook Job runs
    # `toolgate migrate` with it before every install and upgrade. Hooks need
    # Helm or Flux: `helm template | kubectl apply` skips them.
    migrationSecret: ""
    # -- Key in `config.database.migrationSecret` that holds the connection
    # string.
    migrationSecretKey: url

  oidc:
    # -- Issuer URL of the OIDC identity provider that users sign in with,
    # such as `https://idp.example.com/realms/main`. Required.
    issuerURL: ""
    # -- (string or list) Audiences that users' access tokens may be for: one value such as
    # `toolgate`, or a list of 1 to 8 such as `[toolgate, coder-toolgate]`.
    # Each is the client ID of a client at `config.oidc.issuerURL`.
    # Required. The gateway accepts access tokens of every listed client, so
    # list only clients made for toolgate.
    audience: ""
    # -- More issuers whose access tokens the gateway accepts, for an
    # identity provider that gives each client its own issuer (Authentik
    # does). At most 8. Each item has an `issuerURL`, exactly as in its
    # tokens' `iss` claim, and an `audience`, one value or a list of 1 to 8.
    # Every issuer must give one person the same `sub` claim. The CLI and the
    # web UI still use `config.oidc.issuerURL`.
    additionalIssuers: []
    # -- OIDC client ID that `toolgate login` signs in with, such as
    # `toolgate-cli`. It must be a public client with the device
    # authorization grant. The gateway publishes it, so users need no
    # `--client-id`. It is usually also in `config.oidc.audience`. It may be
    # the same client as `config.ui.clientID`.
    cliClientID: ""
    # -- Scopes that `toolgate login` asks for. Empty means the gateway's
    # default, `openid email profile offline_access`.
    cliScopes: []
    # -- Access token claim that holds the user's email address. Empty means
    # the gateway's default, `email`.
    emailClaim: ""
    # -- Access token claim that tells whether the identity provider verified
    # the email address. Empty means the gateway's default, `email_verified`.
    emailVerifiedClaim: ""
    # -- Access token claim that holds the user's groups. Empty means the
    # gateway's default, `groups`.
    groupsClaim: ""

  ui:
    # -- URL where users open the gateway in a browser, such as
    # `https://toolgate.example.com`. Required when `config.ui.clientID` is
    # set. It must be `https://`.
    publicURL: ""
    # -- OIDC client ID of the web UI. The web UI is on only when this is
    # set. The identity provider must allow the redirect URI
    # `config.ui.publicURL` + `/ui/auth/callback`.
    clientID: ""
    # -- Path of a file that holds the web UI client's secret, mounted from a
    # Secret with `persistence`. Empty means a public client.
    clientSecretFile: ""
    # -- Scopes the web UI asks for at sign-in. Empty means the gateway's
    # default, `openid email profile`.
    scopes: []
    # -- Group whose members are web UI admins. Empty means nobody is an
    # admin.
    adminGroup: ""
    # -- How long a call that needs approval waits for a person, and how long
    # an approved request stays usable, as a Go duration from `1m` to `1h`.
    approvalTimeout: 10m

  # -- URL of the MCP endpoint as MCP clients on the internet reach it, such
  # as `https://mcp.example.com/mcp`. The gateway names it in its OAuth
  # protected resource metadata, so that claude.ai connectors can sign in.
  # It must be `https://`. Empty means `config.ui.publicURL` + `/mcp`; with
  # both empty, the gateway serves no metadata. See the connectors page of
  # the admin docs.
  mcpPublicURL: ""

  # -- Namespaces whose `MCPServerTemplate` and `ToolgateRule` objects the
  # gateway reads, such as `[toolgate-catalog]`. Empty means the release
  # namespace.
  catalogNamespaces: []

  logging:
    # -- Lowest level of the JSON log lines: `debug`, `info`, `warn` or
    # `error`.
    level: info

  # -- OTLP/HTTP endpoint for the gateway's traces, such as
  # `http://otel-collector:4318`. Empty turns trace export off.
  otlpEndpoint: ""

  # -- How long a session can go without requests before the gateway ends it
  # and stops its per-session MCP servers, as a Go duration such as `2h`.
  sessionIdleTimeout: 2h

  # -- How long the gateway keeps the list of enabled servers of an ended
  # session, as a Go duration from `1h` to `168h` (7 days).
  sessionResumeWindow: 24h

  limits:
    # -- Maximum number of MCP server instances that run for one user at the
    # same time. Per-session and per-user instances count for the user who
    # started them. Shared instances do not count. At least 1.
    instancesPerUser: 20
    # -- Maximum number of MCP server instances that the gateway runs at the
    # same time, for all users and shared instances together. At least 1.
    instances: 200

  # -- Put the owner's verified email and name on the annotations of instance
  # namespaces and objects. Set it to `false` to keep personal data off
  # cluster objects. The owner's subject is annotated either way.
  instanceOwnerDetails: true

  # -- Turn on tool search mode for sessions whose client sends no
  # `X-Toolgate-Tool-Search` header. A client can still turn it on or off
  # with that header. It only changes which tools a session lists.
  toolSearch: false

  # Optional embeddings for tool search. With `url` set, search ranks by
  # meaning as well as by words. The gateway sends the search query and the
  # tool descriptions to this endpoint, so run it in the cluster. Allow egress
  # from the gateway pods only to this host and port.
  toolSearchEmbeddings:
    # -- Base URL of an endpoint that speaks the OpenAI embeddings API
    # (`POST <url>/v1/embeddings`), such as `http://tei.tools.svc:80`. Empty
    # means search uses words only.
    url: ""
    # -- Model name sent to the endpoint, such as `BAAI/bge-small-en-v1.5`.
    # Required when `url` is set. Changing it embeds all tools again.
    model: ""
    # -- Path of a file that holds an API key for the endpoint, mounted from a
    # Secret with `persistence`. Empty means no key.
    apiKeyFile: ""
    # -- How long one request to the endpoint may take, as a Go duration.
    # Empty means 2s.
    timeout: ""

  audit:
    # -- Store audit payloads: the arguments of each tool call and approval
    # request, and each tool result. Payloads under 64 KiB go in PostgreSQL,
    # larger ones in the S3 bucket. If true, `config.audit.s3.bucket` is
    # required.
    payloads: false
    s3:
      # -- URL of the S3 API, such as `https://s3.example.com`. Empty means
      # the AWS S3 endpoint of `config.audit.s3.region`.
      endpoint: ""
      # -- S3 region of the bucket, such as `us-east-1`.
      region: ""
      # -- S3 bucket for large audit payloads. Required when
      # `config.audit.payloads` is true.
      bucket: ""
      # -- Prefix of the payload object keys, such as `toolgate/`.
      prefix: ""
      # -- Put the bucket name in the URL path instead of the host name.
      # Many S3-compatible servers need true.
      pathStyle: false
      # -- Name of an existing Secret in the release namespace with the S3
      # access key. Empty means the gateway uses the other credential sources
      # of the AWS SDK, such as a web identity token.
      existingSecret: ""
      # -- Key in `config.audit.s3.existingSecret` that holds the access key
      # ID.
      accessKeyIDKey: accessKeyID
      # -- Key in `config.audit.s3.existingSecret` that holds the secret
      # access key.
      secretAccessKeyKey: secretAccessKey

  # -- Resolvers: HTTP services a template's `${resolver:<name>}` gets a
  # value from. Each item has a `name`, an `https://` `url`, an `audience`,
  # an optional `timeout` (default `10s`, at most `60s`) and an optional
  # `caFile`. The chart writes them to the gateway's configuration file and
  # mounts a service-account token with each resolver's audience at
  # `/var/run/secrets/toolgate/resolvers/<name>/token`. Mount a `caFile`
  # with `resources.persistence`.
  resolvers: []

  spiffe:
    # -- SPIFFE trust domains whose JWT-SVIDs may sign in, attested as the
    # workload. Each item has a `name` (the trust domain), exactly one of
    # `bundleEndpointURL` (a SPIFFE bundle endpoint with the `https_web`
    # profile) and `jwksURL` (a JWKS document, such as that of SPIRE's OIDC
    # discovery provider), both `https://`, and an optional `caFile`. The
    # chart writes them to the gateway's configuration file. Mount a
    # `caFile` with `resources.persistence`.
    trustDomains: []

  # -- Attested user sessions: a user's token plus a workload token from a
  # workspace pod (or a SPIFFE workload) bound to that user, so the
  # session's workspace is verified. Off when null. It has `namespaces`
  # (required), `keys` (`userID`, `email`, `username` and `workspace`: pod
  # label keys, Coder's by default), `match` (`by: email`, or `by: claim`
  # with `claim` and `key`), `workspaceID` (such as
  # `coder/{username}/{workspace}`) and an optional `spiffeIDPattern`. The
  # chart writes it to the gateway's configuration file. See
  # docs/admin/workspace-attestation.md.
  workspaceAttestation: null

  # -- More environment variables for the gateway container, as a list of
  # Kubernetes `EnvVar` objects.
  extraEnv: []

  serviceAccount:
    # -- Name of the gateway's service account. Empty means the release's
    # full name. The RBAC rules and the admission policy apply to this
    # account.
    name: ""

  service:
    # -- Session affinity of the gateway's Service: `None` or `ClientIP`.
    # toolgate does not need affinity to be correct. `ClientIP` makes replica
    # switches rare.
    sessionAffinity: None

  serviceMonitor:
    # -- Create a Prometheus Operator `ServiceMonitor` for the metrics
    # Service. The `ServiceMonitor` CRD must be installed.
    enabled: false

  sharedNamespace:
    # -- Name of the namespace for instances of `namespace: shared`
    # templates. Empty means the chart creates none. It must not start with
    # `tg-`.
    name: ""
    # -- Create the shared namespace with toolgate's labels. If false, the
    # namespace must exist and carry the labels
    # `toolgate.soliddowant.dev/writable: "true"` and
    # `pod-security.kubernetes.io/enforce: restricted`.
    create: true

  crds:
    # -- Install toolgate's CRDs with the chart. `helm upgrade` updates them.
    # If false, install them yourself.
    enabled: true
    # -- Keep the CRDs, and so every template, rule and settings profile,
    # when the release is uninstalled (`helm.sh/resource-policy: keep`).
    keep: true

rbac:
  # -- More RBAC rules for the gateway's ClusterRole, added after the
  # default rules. Grant each extra kind a template contains `create`,
  # `patch`, `delete`, `get`, `list` and `watch`. The admission policy still
  # confines every write to toolgate's namespaces.
  extraRules: []
  # extraRules:
  #   - apiGroups: ["helm.toolkit.fluxcd.io"]
  #     resources: ["helmreleases"]
  #     verbs: ["create", "patch", "delete", "get", "list", "watch"]

# -- The gateway's Deployment, Services, ServiceAccount, PodDisruptionBudget
# and ServiceMonitor, in the values format of the bjw-s `common` library chart
# (https://bjw-s-labs.github.io/helm-charts/docs/common-library/). Override any
# part, such as probes, affinity, resources or extra containers. String values
# can use Helm templates. The RBAC rules (see `rbac.extraRules`) and the
# admission policy are not here.
# @default -- see `values.yaml`
resources:
  defaultPodOptions:
    # The gateway talks to the Kubernetes API with its service account token.
    automountServiceAccountToken: true
    enableServiceLinks: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
  controllers:
    gateway:
      type: deployment
      replicas: "{{ .Values.config.replicas }}"
      strategy: RollingUpdate
      serviceAccount:
        identifier: gateway
      pod:
        # Spread the replicas over nodes.
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: "{{ .Chart.Name }}"
                      app.kubernetes.io/instance: "{{ .Release.Name }}"
                      app.kubernetes.io/controller: gateway
      containers:
        gateway:
          image:
            repository: "{{ .Values.config.image.repository }}"
            tag: "{{ .Values.config.image.tag | default .Chart.AppVersion }}"
            pullPolicy: "{{ .Values.config.image.pullPolicy }}"
          args:
            - serve
          # templates/common.yaml adds the gateway's settings from `config`
          # before these.
          env: []
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          probes:
            liveness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /healthz
                  port: http
            readiness:
              enabled: true
              custom: true
              spec:
                httpGet:
                  path: /readyz
                  port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # The memory request equals the limit, so the pod is never killed
          # for memory a node gave to another pod. No CPU limit, so the
          # gateway is never throttled.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
    # The migration Job. It renders only when `config.database.migrationUrl` or
    # `config.database.migrationSecret` is set and `config.database.migrateOnStart` is false. It mounts nothing
    # from the release, because the release's ConfigMap and Secrets don't exist
    # yet when it runs. Mount client certificates with
    # `resources.persistence.<name>.advancedMounts.migrate`.
    migrate:
      enabled: '{{ include "toolgate.migrateJobEnabled" . }}'
      type: job
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "0"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      serviceAccount:
        identifier: migrate
      job:
        backoffLimit: 2
        activeDeadlineSeconds: 240
      pod:
        restartPolicy: Never
        automountServiceAccountToken: false
      containers:
        migrate:
          image:
            repository: "{{ .Values.config.image.repository }}"
            tag: "{{ .Values.config.image.tag | default .Chart.AppVersion }}"
            pullPolicy: "{{ .Values.config.image.pullPolicy }}"
          args:
            - migrate
          env: []
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
  service:
    gateway:
      controller: gateway
      forceRename: '{{ include "toolgate.fullname" . }}'
      sessionAffinity: "{{ .Values.config.service.sessionAffinity }}"
      ports:
        http:
          port: 80
          targetPort: 8080
    metrics:
      controller: gateway
      labels:
        app.kubernetes.io/component: metrics
      ports:
        metrics:
          port: 9090
          targetPort: 9090
  serviceAccount:
    gateway:
      forceRename: '{{ include "toolgate.serviceAccountName" . }}'
    # The migration Job's service account, with no RBAC. The release's own
    # service account doesn't exist yet at install.
    migrate:
      enabled: '{{ include "toolgate.migrateJobEnabled" . }}'
      forceRename: '{{ include "toolgate.fullname" . }}-migrate'
      automountServiceAccountToken: false
      annotations:
        helm.sh/hook: pre-install,pre-upgrade
        helm.sh/hook-weight: "-20"
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  serviceMonitor:
    gateway:
      enabled: "{{ .Values.config.serviceMonitor.enabled }}"
      # Keep the Prometheus job label set to the service name (the library
      # defaults to the chart name).
      jobLabel: app.kubernetes.io/service
      service:
        identifier: metrics
      endpoints:
        - port: metrics
  rawResources:
    gateway-pdb:
      forceRename: '{{ include "toolgate.fullname" . }}'
      manifest:
        apiVersion: policy/v1
        kind: PodDisruptionBudget
        spec:
          minAvailable: 1
          # Evicting a pod that isn't ready never lowers availability, and
          # lets node drains finish when a replica is stuck.
          unhealthyPodEvictionPolicy: AlwaysAllow
          selector:
            matchLabels:
              app.kubernetes.io/name: "{{ .Chart.Name }}"
              app.kubernetes.io/instance: "{{ .Release.Name }}"
              app.kubernetes.io/controller: gateway

# Optional model server for tool search. It is off by default. It runs
# Hugging Face text-embeddings-inference from a local model directory, with no
# network access needed. A hook Job downloads the model before install and
# upgrade, so that is the only pod that needs internet egress. The chart adds
# no NetworkPolicy; cluster admins do that. When a server is on, the chart
# sets `config.toolSearchEmbeddings` itself, unless you set `url` there.
embeddings:
  server:
    # -- Run the embeddings server.
    enabled: false
    image:
      # -- Image of text-embeddings-inference. The CPU image is x86-64 only;
      # set another image for ARM64.
      repository: ghcr.io/huggingface/text-embeddings-inference
      tag: cpu-1.9
      # -- Digest of the image. Pins it.
      digest: sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    # -- Hugging Face model the server loads.
    model: BAAI/bge-small-en-v1.5
    # -- Commit of the model repository, a full 40-character SHA. The hook Job
    # downloads exactly this revision.
    modelRevision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
    # -- Memory request equals the limit; there is no CPU limit. About 320 MiB
    # are in use after the model is loaded and has served requests.
    resources:
      requests:
        cpu: 500m
        memory: 768Mi
      limits:
        memory: 768Mi
    cache:
      # -- Name of an existing PersistentVolumeClaim for the model files.
      # Recommended: an RWX claim you create, so it survives uninstall and the
      # pre-upgrade Job can mount it while the server runs. If empty, the
      # chart creates a claim `<release>-toolgate-models` that Helm keeps.
      existingClaim: ""
      # -- Size of the claim the chart creates.
      size: 5Gi
      # -- Storage class of the claim the chart creates. Empty means the
      # cluster default.
      storageClassName: ""
      # -- Access modes of the claim the chart creates.
      accessModes: [ReadWriteMany]
    scaleToZero:
      # -- Let the gateway scale the embeddings server to zero replicas when
      # tool search is idle, and back to one when it is needed. The
      # Deployment then has no `replicas` field. Can't be used with
      # `config.toolSearchEmbeddings.url`. See `docs/admin/chart.md`.
      enabled: false
      # -- How long tool search must be idle before the gateway scales the
      # server to zero. A duration in hours, minutes and seconds, such as
      # `15m` or `1h30m`, from `1m` to `24h`.
      idleTimeout: 15m
  downloader:
    image:
      # -- Image that runs the model download Job: a pinned `uv`, which runs
      # the `hf` command of huggingface_hub.
      repository: ghcr.io/astral-sh/uv
      tag: 0.9-python3.13-bookworm-slim
      digest: sha256:531f855bda2c73cd6ef67d56b733b357cea384185b3022bd09f05e002cd144ca
    # -- Version of huggingface_hub that `uvx` installs.
    hubVersion: "1.0.0"
    # -- Seconds a finished Job stays before Kubernetes removes it.
    ttlSecondsAfterFinished: 3600

# Grafana dashboards for the gateway's metrics. They are off by default. They
# read the Prometheus metrics the gateway serves (see `docs/admin/metrics.md`)
# and work with any Prometheus-compatible data source.
dashboards:
  # -- Create one ConfigMap for each dashboard, for the Grafana dashboard
  # sidecar. Ignored when `dashboards.grafanaOperator.enabled` is true.
  enabled: false
  # -- Key of the label the sidecar selects ConfigMaps by.
  labelKey: grafana_dashboard
  # -- Value of that label.
  labelValue: "1"
  # -- Annotations of the dashboard ConfigMaps, such as
  # `grafana_folder: toolgate` for the sidecar's folder annotation.
  annotations: {}
  grafanaOperator:
    # -- Create a grafana-operator v5 `GrafanaDashboard` for each dashboard
    # instead of a ConfigMap.
    enabled: false
    # -- Which Grafana instances load the dashboards: the `matchLabels` of the
    # `GrafanaDashboard` `instanceSelector`. Required with
    # `dashboards.grafanaOperator.enabled`.
    instanceSelector:
      matchLabels: {}
    # -- Grafana folder for the dashboards. Empty means the General folder.
    folder: ""
    # -- Namespaces whose Grafana instances may load the dashboards:
    # `allowCrossNamespaceImport`.
    allowCrossNamespaceImport: false
