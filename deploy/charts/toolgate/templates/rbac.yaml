# The gateway creates instance namespaces on the fly, so it needs a
# ClusterRole. The admission policy (admission-policy.yaml), not RBAC, confines
# where these rules can be used. These rules only write Secrets. The gateway
# reads Secrets only in the template secrets namespace, through the Role below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "toolgate.clusterName" . }}
  labels:
    {{- include "toolgate.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "serviceaccounts", "persistentvolumeclaims"]
    verbs: ["create", "patch", "delete", "get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["create", "patch", "delete", "get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "patch", "delete", "get", "list", "watch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["create", "patch", "delete", "get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  # toolgate reads its own custom resources and writes only their status.
  - apiGroups: ["toolgate.soliddowant.dev"]
    resources: ["mcpservertemplates", "toolgaterules", "settingsprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["toolgate.soliddowant.dev"]
    resources: ["mcpservertemplates/status", "toolgaterules/status", "settingsprofiles/status"]
    verbs: ["update", "patch"]
  {{- if include "toolgate.persistentVolumes" . }}
  # Volumes that outlive an instance. The admission policy lets the gateway
  # change only the volumes it labelled.
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get"]
  {{- end }}
  {{- with .Values.rbac.extraRules }}
  # The admin's extra rules (`rbac.extraRules`).
  {{- toYaml . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "toolgate.clusterName" . }}
  labels:
    {{- include "toolgate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "toolgate.clusterName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "toolgate.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# The leader-election Lease and the gateway's own configuration, in the
# release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "toolgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "toolgate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "toolgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "toolgate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "toolgate.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "toolgate.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if include "toolgate.embeddingsScaleToZero" . }}
---
# Scaling the embeddings server between 0 and 1: its scale and the
# Deployment's status, for that one Deployment only. No list or watch.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "toolgate.embeddingsName" . }}-scaler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "toolgate.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames: [{{ include "toolgate.embeddingsName" . | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ include "toolgate.embeddingsName" . | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "toolgate.embeddingsName" . }}-scaler
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "toolgate.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "toolgate.embeddingsName" . }}-scaler
subjects:
  - kind: ServiceAccount
    name: {{ include "toolgate.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- with .Values.config.templateSecretsNamespace }}
---
# Reading Secrets in the template secrets namespace, and nowhere else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "toolgate.fullname" $ }}-template-secrets
  namespace: {{ . }}
  labels:
    {{- include "toolgate.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "toolgate.fullname" $ }}-template-secrets
  namespace: {{ . }}
  labels:
    {{- include "toolgate.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "toolgate.fullname" $ }}-template-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "toolgate.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
