{{- if not .Values.database.existingSecret }}
{{- fail "database.existingSecret is required: the name of a Secret that holds the PostgreSQL connection string" }}
{{- end }}
{{- if not .Values.oidc.issuerURL }}
{{- fail "oidc.issuerURL is required: the issuer URL of the OIDC identity provider" }}
{{- end }}
{{- if not .Values.oidc.audience }}
{{- fail "oidc.audience is required: the audience of users' access tokens" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "toolgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "toolgate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "toolgate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "toolgate.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "toolgate.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          env:
            - name: TOOLGATE_LISTEN_ADDRESS
              value: ":8080"
            - name: TOOLGATE_METRICS_LISTEN_ADDRESS
              value: ":9090"
            - name: TOOLGATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            - name: TOOLGATE_OIDC_ISSUER_URL
              value: {{ .Values.oidc.issuerURL | quote }}
            - name: TOOLGATE_OIDC_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            {{- with .Values.oidc.emailClaim }}
            - name: TOOLGATE_OIDC_EMAIL_CLAIM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.emailVerifiedClaim }}
            - name: TOOLGATE_OIDC_EMAIL_VERIFIED_CLAIM
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.groupsClaim }}
            - name: TOOLGATE_OIDC_GROUPS_CLAIM
              value: {{ . | quote }}
            {{- end }}
            - name: TOOLGATE_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.otlpEndpoint }}
            - name: TOOLGATE_OTLP_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        {{- if .Values.affinity }}
        {{- toYaml .Values.affinity | nindent 8 }}
        {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "toolgate.selectorLabels" . | nindent 20 }}
        {{- end }}
