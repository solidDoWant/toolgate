# Confines every write by the gateway's service account, whatever RBAC grants
# it, so a compromised gateway can't write outside toolgate's namespaces.
# RBAC, not this policy, decides which kinds it may write there.
# docs/admin/chart.md explains the rules.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "toolgate.clusterName" . }}
  labels:
    {{- include "toolgate.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["*/*"]
    # TokenReviews are not stored; checking a token writes nothing.
    excludeResourceRules:
      - apiGroups: ["authentication.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE"]
        resources: ["tokenreviews"]
  matchConditions:
    - name: gateway-service-account
      expression: >-
        request.userInfo.username ==
        "system:serviceaccount:{{ .Release.Namespace }}:{{ include "toolgate.serviceAccountName" . }}"
  variables:
    # The request leaves out these fields when they are empty.
    - name: subResource
      expression: 'has(request.subResource) ? request.subResource : ""'
    - name: requestNamespace
      expression: 'has(request.namespace) ? request.namespace : ""'
    - name: isNamespace
      expression: request.kind.group == "" && request.kind.kind == "Namespace" && variables.subResource == ""
    # The leader-election Lease in the release namespace.
    - name: isOwnLease
      expression: >-
        request.kind.group == "coordination.k8s.io" && request.kind.kind == "Lease" &&
        variables.requestNamespace == "{{ .Release.Namespace }}"
    # The status of toolgate's own custom resources, in the namespaces it watches.
    - name: isCatalogStatus
      expression: request.resource.group == "toolgate.soliddowant.dev" && variables.subResource == "status"
    {{- if include "toolgate.embeddingsScaleToZero" . }}
    # The scale of the embeddings server's Deployment, which the gateway
    # scales between 0 and 1. Not the Deployment itself.
    - name: isEmbeddingsScale
      expression: >-
        request.resource.group == "apps" && request.resource.resource == "deployments" &&
        variables.subResource == "scale" && request.operation == "UPDATE" &&
        variables.requestNamespace == "{{ .Release.Namespace }}" &&
        request.name == "{{ include "toolgate.embeddingsName" . }}"
    {{- end }}
    {{- if include "toolgate.persistentVolumes" . }}
    - name: isVolume
      expression: request.kind.group == "" && request.kind.kind == "PersistentVolume" && variables.subResource == ""
    # A PV the gateway labelled, or one that a provisioner made for a claim in
    # an instance namespace and that the gateway has not labelled yet.
    - name: isOwnVolume
      expression: >-
        variables.isVolume && (request.operation == "UPDATE" || request.operation == "DELETE") && (
          (has(oldObject.metadata.labels) &&
           oldObject.metadata.labels[?"toolgate.soliddowant.dev/volume-id"].orValue("") != "") ||
          (request.operation == "UPDATE" && has(oldObject.spec.claimRef) &&
           oldObject.spec.claimRef.namespace.startsWith("tg-") &&
           has(oldObject.spec.claimRef.uid) &&
           oldObject.metadata.name == "pvc-" + oldObject.spec.claimRef.uid &&
           has(oldObject.metadata.annotations) &&
           oldObject.metadata.annotations[?"pv.kubernetes.io/provisioned-by"].orValue("") != ""))
    {{- end }}
    - name: inToolgateNamespace
      expression: >-
        namespaceObject != null && has(namespaceObject.metadata.labels) &&
        namespaceObject.metadata.labels[?"toolgate.soliddowant.dev/writable"].orValue("") == "true"
    # Pod Security admission checks every pod in such a namespace, so the
    # gateway can't run a privileged, host-namespace or hostPath pod.
    - name: inRestrictedNamespace
      expression: >-
        namespaceObject != null && has(namespaceObject.metadata.labels) &&
        namespaceObject.metadata.labels[?"pod-security.kubernetes.io/enforce"].orValue("") == "restricted"
  validations:
    - expression: variables.isOwnLease || variables.isCatalogStatus || variables.isNamespace || variables.inToolgateNamespace{{ if include "toolgate.embeddingsScaleToZero" . }} || variables.isEmbeddingsScale{{ end }}{{ if include "toolgate.persistentVolumes" . }} || variables.isOwnVolume{{ end }}
      messageExpression: >-
        "toolgate's service account may write only in namespaces labelled toolgate.soliddowant.dev/writable=true, not in " +
        (variables.requestNamespace != "" ? variables.requestNamespace : "the cluster scope")
      reason: Forbidden
    - expression: variables.isOwnLease || variables.isCatalogStatus || variables.isNamespace || variables.inRestrictedNamespace{{ if include "toolgate.embeddingsScaleToZero" . }} || variables.isEmbeddingsScale{{ end }}{{ if include "toolgate.persistentVolumes" . }} || variables.isOwnVolume{{ end }}
      messageExpression: >-
        "toolgate's service account may write only in namespaces labelled pod-security.kubernetes.io/enforce=restricted, not in " +
        (variables.requestNamespace != "" ? variables.requestNamespace : "the cluster scope")
      reason: Forbidden
    - expression: >-
        !variables.isNamespace || request.operation != "CREATE" || (
        object.metadata.name.startsWith("tg-") && has(object.metadata.labels) &&
        object.metadata.labels[?"toolgate.soliddowant.dev/writable"].orValue("") == "true" &&
        object.metadata.labels[?"pod-security.kubernetes.io/enforce"].orValue("") == "restricted")
      message: >-
        toolgate's service account may create only namespaces named tg-* and labelled
        toolgate.soliddowant.dev/writable=true and pod-security.kubernetes.io/enforce=restricted
      reason: Forbidden
    # The gateway only creates and deletes namespaces, so it can't remove or
    # weaken a Pod Security label.
    - expression: '!variables.isNamespace || request.operation != "UPDATE"'
      message: toolgate's service account may not update namespaces
      reason: Forbidden
    - expression: >-
        !variables.isNamespace || request.operation != "DELETE" || (
        has(oldObject.metadata.labels) &&
        oldObject.metadata.labels[?"toolgate.soliddowant.dev/instance"].orValue("") != "")
      message: >-
        toolgate's service account may delete only namespaces labelled toolgate.soliddowant.dev/instance,
        so it can never delete the shared namespace
      reason: Forbidden
    {{- if include "toolgate.persistentVolumes" . }}
    # Keep the labels that tie a PV to its row, and point claims only at instance namespaces.
    - expression: >-
        !variables.isVolume || request.operation != "UPDATE" || (
        has(object.metadata.labels) &&
        object.metadata.labels[?"app.kubernetes.io/managed-by"].orValue("") == "toolgate" &&
        object.metadata.labels[?"toolgate.soliddowant.dev/volume-id"].orValue("") != "" &&
        (!has(oldObject.metadata.labels) ||
         oldObject.metadata.labels[?"toolgate.soliddowant.dev/volume-id"].orValue("") == "" ||
         object.metadata.labels["toolgate.soliddowant.dev/volume-id"] ==
           oldObject.metadata.labels["toolgate.soliddowant.dev/volume-id"]) &&
        (!has(object.spec.claimRef) || object.spec.claimRef.namespace.startsWith("tg-")))
      message: toolgate's service account may change only PersistentVolumes it labelled, and may bind them only to claims in tg-* namespaces
      reason: Forbidden
    # Delete only after the reclaim policy is Delete, so that deleting frees the storage.
    - expression: >-
        !variables.isVolume || request.operation != "DELETE" ||
        oldObject.spec.persistentVolumeReclaimPolicy == "Delete"
      message: toolgate's service account may delete a PersistentVolume only after setting its reclaim policy to Delete
      reason: Forbidden
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "toolgate.clusterName" . }}
  labels:
    {{- include "toolgate.labels" . | nindent 4 }}
spec:
  policyName: {{ include "toolgate.clusterName" . }}
  validationActions: ["Deny"]
