{{- /*
The gateway's Deployment, Services, ServiceAccount, PodDisruptionBudget and
ServiceMonitor, rendered by the bjw-s common library from `resources`, after
this template applies `tpl` to its string values and adds the gateway's
settings from `config`.
*/ -}}
{{- with .Values.config }}
{{- if and .database.url .database.existingSecret }}
{{- fail "config.database.url and config.database.existingSecret are both set: set exactly one source for the PostgreSQL connection string" }}
{{- end }}
{{- if not (or .database.url .database.existingSecret) }}
{{- fail "config.database.url or config.database.existingSecret is required: the connection string inline, or the name of a Secret that holds it" }}
{{- end }}
{{- if and .database.migrationUrl .database.migrationSecret }}
{{- fail "config.database.migrationUrl and config.database.migrationSecret are both set: set exactly one source for the migration connection string" }}
{{- end }}
{{- if not .oidc.issuerURL }}
{{- fail "config.oidc.issuerURL is required: the issuer URL of the OIDC identity provider" }}
{{- end }}
{{- if not .oidc.audience }}
{{- fail "config.oidc.audience is required: the audience of users' access tokens" }}
{{- end }}
{{- if and .ui.clientID (not .ui.publicURL) }}
{{- fail "config.ui.publicURL is required with config.ui.clientID: the URL where users open the web UI" }}
{{- end }}
{{- range $setting := list "instancesPerUser" "instances" }}
{{- $value := index $.Values.config.limits $setting }}
{{- if or (not (has (kindOf $value) (list "int" "int64" "float64"))) (lt (float64 $value) 1.0) (ne (float64 $value) (floor $value)) }}
{{- fail (printf "config.limits.%s must be a whole number of at least 1" $setting) }}
{{- end }}
{{- end }}
{{- if and .audit.payloads (not .audit.s3.bucket) }}
{{- fail "config.audit.s3.bucket is required when config.audit.payloads is true" }}
{{- end }}
{{- end }}

{{- $resources := mustDeepCopy .Values.resources -}}
{{- include "toolgate.tplValues" (dict "map" $resources "root" .) -}}

{{- /* The gateway's settings, ahead of any env the values add. */ -}}
{{- $config := .Values.config -}}
{{- $env := list
  (dict "name" "TOOLGATE_LISTEN_ADDRESS" "value" ":8080")
  (dict "name" "TOOLGATE_METRICS_LISTEN_ADDRESS" "value" ":9090")
  (ternary (dict "name" "TOOLGATE_DATABASE_URL" "value" $config.database.url) (dict "name" "TOOLGATE_DATABASE_URL" "valueFrom" (dict "secretKeyRef" (dict "name" $config.database.existingSecret "key" $config.database.secretKey))) (not (empty $config.database.url)))
  (dict "name" "TOOLGATE_MIGRATE_ON_START" "value" (toString $config.database.migrateOnStart))
  (dict "name" "TOOLGATE_OIDC_ISSUER_URL" "value" $config.oidc.issuerURL)
  (dict "name" "TOOLGATE_OIDC_AUDIENCE" "value" (join "," $config.oidc.audience))
-}}
{{- range $setting, $name := dict "emailClaim" "TOOLGATE_OIDC_EMAIL_CLAIM" "emailVerifiedClaim" "TOOLGATE_OIDC_EMAIL_VERIFIED_CLAIM" "groupsClaim" "TOOLGATE_OIDC_GROUPS_CLAIM" }}
{{- with index $config.oidc $setting }}
{{- $env = append $env (dict "name" $name "value" .) }}
{{- end }}
{{- end }}
{{- with $config.oidc.cliClientID }}
{{- $env = append $env (dict "name" "TOOLGATE_OIDC_CLI_CLIENT_ID" "value" .) }}
{{- end }}
{{- with $config.oidc.cliScopes }}
{{- $env = append $env (dict "name" "TOOLGATE_OIDC_CLI_SCOPES" "value" (join "," .)) }}
{{- end }}
{{- with $config.ui }}
{{- range $setting, $name := dict "publicURL" "TOOLGATE_PUBLIC_URL" "clientID" "TOOLGATE_OIDC_UI_CLIENT_ID" "clientSecretFile" "TOOLGATE_OIDC_UI_CLIENT_SECRET_FILE" "adminGroup" "TOOLGATE_ADMIN_GROUP" }}
{{- with index $.Values.config.ui $setting }}
{{- $env = append $env (dict "name" $name "value" .) }}
{{- end }}
{{- end }}
{{- with .scopes }}
{{- $env = append $env (dict "name" "TOOLGATE_OIDC_UI_SCOPES" "value" (join "," .)) }}
{{- end }}
{{- end }}
{{- $env = append $env (dict "name" "TOOLGATE_LEASE_NAMESPACE" "value" .Release.Namespace) -}}
{{- $env = append $env (dict "name" "TOOLGATE_GATEWAY_POD_LABELS" "value" (printf "app.kubernetes.io/name=%s,app.kubernetes.io/instance=%s" .Chart.Name .Release.Name)) -}}
{{- with $config.catalogNamespaces }}
{{- $env = append $env (dict "name" "TOOLGATE_CATALOG_NAMESPACES" "value" (join "," .)) }}
{{- end }}
{{- with $config.sharedNamespace.name }}
{{- $env = append $env (dict "name" "TOOLGATE_SHARED_NAMESPACE" "value" .) }}
{{- end }}
{{- $env = append $env (dict "name" "TOOLGATE_INSTANCE_LIMIT_PER_USER" "value" (toString (int $config.limits.instancesPerUser))) -}}
{{- $env = append $env (dict "name" "TOOLGATE_INSTANCE_LIMIT" "value" (toString (int $config.limits.instances))) -}}
{{- $env = append $env (dict "name" "TOOLGATE_SESSION_IDLE_TIMEOUT" "value" $config.sessionIdleTimeout) -}}
{{- $env = append $env (dict "name" "TOOLGATE_SESSION_RESUME_WINDOW" "value" $config.sessionResumeWindow) -}}
{{- with $config.ui.approvalTimeout }}
{{- $env = append $env (dict "name" "TOOLGATE_APPROVAL_TIMEOUT" "value" .) }}
{{- end }}
{{- $ownerDetails := true -}}
{{- if hasKey $config "instanceOwnerDetails" }}{{- $ownerDetails = $config.instanceOwnerDetails -}}{{- end }}
{{- $env = append $env (dict "name" "TOOLGATE_INSTANCE_OMIT_OWNER_DETAILS" "value" (toString (not $ownerDetails))) -}}
{{- $env = append $env (dict "name" "TOOLGATE_TOOL_SEARCH" "value" (toString (default false $config.toolSearch))) -}}
{{- with $config.toolSearchEmbeddings }}
{{- range $setting, $name := dict "url" "TOOLGATE_TOOL_SEARCH_EMBEDDINGS_URL" "model" "TOOLGATE_TOOL_SEARCH_EMBEDDINGS_MODEL" "apiKeyFile" "TOOLGATE_TOOL_SEARCH_EMBEDDINGS_API_KEY_FILE" "timeout" "TOOLGATE_TOOL_SEARCH_EMBEDDINGS_TIMEOUT" }}
{{- with index $.Values.config.toolSearchEmbeddings $setting }}
{{- $env = append $env (dict "name" $name "value" .) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* A server the chart runs sets the URL and model, unless config sets a URL. */ -}}
{{- if and .Values.embeddings.server.enabled (not $config.toolSearchEmbeddings.url) }}
{{- $env = append $env (dict "name" "TOOLGATE_TOOL_SEARCH_EMBEDDINGS_URL" "value" (printf "http://%s-embeddings.%s.svc:80" (include "toolgate.fullname" .) .Release.Namespace)) }}
{{- $env = append $env (dict "name" "TOOLGATE_TOOL_SEARCH_EMBEDDINGS_MODEL" "value" .Values.embeddings.server.model) }}
{{- end }}
{{- if include "toolgate.embeddingsScaleToZero" . }}
{{- $env = append $env (dict "name" "TOOLGATE_TOOL_SEARCH_EMBEDDINGS_SCALE_TO_ZERO_DEPLOYMENT" "value" (include "toolgate.embeddingsName" .)) }}
{{- $env = append $env (dict "name" "TOOLGATE_TOOL_SEARCH_EMBEDDINGS_SCALE_TO_ZERO_IDLE_TIMEOUT" "value" (toString .Values.embeddings.server.scaleToZero.idleTimeout)) }}
{{- end }}
{{- $env = append $env (dict "name" "TOOLGATE_LOG_LEVEL" "value" $config.logging.level) -}}
{{- with $config.otlpEndpoint }}
{{- $env = append $env (dict "name" "TOOLGATE_OTLP_ENDPOINT" "value" .) }}
{{- end }}
{{- range $setting, $name := dict "otlpMetricsEndpoint" "TOOLGATE_OTLP_METRICS_ENDPOINT" "otlpLogsEndpoint" "TOOLGATE_OTLP_LOGS_ENDPOINT" "otlpTracesEndpoint" "TOOLGATE_OTLP_TRACES_ENDPOINT" }}
{{- with index $config $setting }}
{{- $env = append $env (dict "name" $name "value" .) }}
{{- end }}
{{- end }}
{{- if $config.otlpIngest }}
{{- $env = append $env (dict "name" "TOOLGATE_OTLP_INGEST" "value" "true") }}
{{- end }}
{{- if $config.dropSessionIdFromMetrics }}
{{- $env = append $env (dict "name" "TOOLGATE_TELEMETRY_DROP_SESSION_ID_FROM_METRICS" "value" "true") }}
{{- end }}
{{- if $config.allowContent }}
{{- $env = append $env (dict "name" "TOOLGATE_TELEMETRY_ALLOW_CONTENT" "value" "true") }}
{{- end }}
{{- with $config.mcpPublicURL }}
{{- $env = append $env (dict "name" "TOOLGATE_MCP_PUBLIC_URL" "value" .) }}
{{- end }}
{{- with $config.audit }}
{{- $env = append $env (dict "name" "TOOLGATE_AUDIT_PAYLOADS" "value" (toString .payloads)) }}
{{- range $setting, $name := dict "endpoint" "TOOLGATE_AUDIT_S3_ENDPOINT" "region" "TOOLGATE_AUDIT_S3_REGION" "bucket" "TOOLGATE_AUDIT_S3_BUCKET" "prefix" "TOOLGATE_AUDIT_S3_PREFIX" }}
{{- with index $config.audit.s3 $setting }}
{{- $env = append $env (dict "name" $name "value" .) }}
{{- end }}
{{- end }}
{{- $env = append $env (dict "name" "TOOLGATE_AUDIT_S3_PATH_STYLE" "value" (toString .s3.pathStyle)) }}
{{- with .s3.existingSecret }}
{{- $env = append $env (dict "name" "AWS_ACCESS_KEY_ID" "valueFrom" (dict "secretKeyRef" (dict "name" . "key" $config.audit.s3.accessKeyIDKey))) }}
{{- $env = append $env (dict "name" "AWS_SECRET_ACCESS_KEY" "valueFrom" (dict "secretKeyRef" (dict "name" . "key" $config.audit.s3.secretAccessKeyKey))) }}
{{- end }}
{{- end }}
{{- $env = append $env (dict "name" "POD_NAMESPACE" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.namespace"))) -}}
{{- $gateway := index $resources "controllers" "gateway" "containers" "gateway" -}}
{{- $_ := set $gateway "env" (concat $env ($gateway.env | default list) ($config.extraEnv | default list)) -}}

{{- /*
Additional OIDC issuers, resolvers and SPIFFE trust domains are set in the
configuration file only.
The file is a ConfigMap mounted at /etc/toolgate/config.yaml, and each
resolver gets its own projected service-account token with its audience.
*/ -}}
{{- $file := dict }}
{{- with $config.resolvers }}
{{- range $resolver := . }}
{{- if not (regexMatch "^[a-z][a-z0-9-]{0,62}$" (toString $resolver.name)) }}
{{- fail (printf "config.resolvers: name %q must be lowercase letters, digits and -, starting with a letter, at most 63 characters" (toString $resolver.name)) }}
{{- end }}
{{- if not $resolver.audience }}
{{- fail (printf "config.resolvers: resolver %q needs an audience" $resolver.name) }}
{{- end }}
{{- end }}
{{- $_ := set $file "resolvers" . }}
{{- end }}
{{- with $config.tokenExchanges }}
{{- range $exchange := . }}
{{- if not (regexMatch "^[a-z][a-z0-9-]{0,62}$" (toString $exchange.name)) }}
{{- fail (printf "config.tokenExchanges: name %q must be lowercase letters, digits and -, starting with a letter, at most 63 characters" (toString $exchange.name)) }}
{{- end }}
{{- range $field := list "tokenURL" "clientID" "clientSecretFile" }}
{{- if not (get $exchange $field) }}
{{- fail (printf "config.tokenExchanges: exchange %q needs a %s" $exchange.name $field) }}
{{- end }}
{{- end }}
{{- if not (hasPrefix "https://" (toString $exchange.tokenURL)) }}
{{- fail (printf "config.tokenExchanges: exchange %q: tokenURL must start with https://" $exchange.name) }}
{{- end }}
{{- end }}
{{- $_ := set $file "tokenExchanges" . }}
{{- end }}
{{- with $config.oidc.additionalIssuers }}
{{- range $issuer := . }}
{{- if not $issuer.issuerURL }}
{{- fail "config.oidc.additionalIssuers: every issuer needs an issuerURL" }}
{{- end }}
{{- if not $issuer.audience }}
{{- fail (printf "config.oidc.additionalIssuers: issuer %q needs an audience" (toString $issuer.issuerURL)) }}
{{- end }}
{{- end }}
{{- $_ := set $file "oidcAdditionalIssuers" . }}
{{- end }}
{{- with (($config.spiffe | default dict).trustDomains) }}
{{- range $domain := . }}
{{- if eq (empty $domain.bundleEndpointURL) (empty $domain.jwksURL) }}
{{- fail (printf "config.spiffe.trustDomains: trust domain %q needs exactly one of bundleEndpointURL and jwksURL" (toString $domain.name)) }}
{{- end }}
{{- end }}
{{- $_ := set $file "spiffeTrustDomains" . }}
{{- end }}
{{- with $config.workspaceAttestation }}
{{- if not .namespaces }}
{{- fail "config.workspaceAttestation: namespaces is required" }}
{{- end }}
{{- $_ := set $file "workspaceAttestation" . }}
{{- end }}
{{- if $file }}
{{- $_ := set $gateway "args" (concat ($gateway.args | default list) (list "--config" "/etc/toolgate/config.yaml")) }}
{{- $_ := set $resources "configMaps" (merge ($resources.configMaps | default dict) (dict "config" (dict "data" (dict "config.yaml" (toYaml $file))))) }}
{{- $persistence := $resources.persistence | default dict }}
{{- $_ := set $persistence "config" (dict "type" "configMap" "identifier" "config" "advancedMounts" (dict "gateway" (dict "gateway" (list (dict "path" "/etc/toolgate/config.yaml" "subPath" "config.yaml" "readOnly" true))))) }}
{{- range $resolver := ($config.resolvers | default list) }}
{{- $token := dict "serviceAccountToken" (dict "audience" $resolver.audience "expirationSeconds" 600 "path" "token") }}
{{- $_ := set $persistence (printf "resolver-%s" $resolver.name) (dict "type" "custom" "volumeSpec" (dict "projected" (dict "sources" (list $token))) "advancedMounts" (dict "gateway" (dict "gateway" (list (dict "path" (printf "/var/run/secrets/toolgate/resolvers/%s" $resolver.name) "readOnly" true))))) }}
{{- end }}
{{- $_ := set $resources "persistence" $persistence }}
{{- end }}

{{- if include "toolgate.migrateJobEnabled" . }}
{{- $migrateContainer := $resources.controllers.migrate.containers.migrate }}
{{- $migrateURL := dict "name" "TOOLGATE_DATABASE_URL" }}
{{- if $config.database.migrationUrl }}
{{- $_ := set $migrateURL "value" $config.database.migrationUrl }}
{{- else }}
{{- $_ := set $migrateURL "valueFrom" (dict "secretKeyRef" (dict "name" $config.database.migrationSecret "key" $config.database.migrationSecretKey)) }}
{{- end }}
{{- $_ := set $migrateContainer "env" (concat (list $migrateURL) ($migrateContainer.env | default list)) }}
{{- end }}

{{- with $config.imagePullSecrets }}
{{- $_ := set $resources.defaultPodOptions "imagePullSecrets" . }}
{{- end }}

{{- /* Merge the values into the layout the common library expects. */ -}}
{{- $merged := omit (mustDeepCopy .Values) "resources" -}}
{{- $merged = mustMergeOverwrite $merged $resources -}}
{{- $_ := set . "Values" $merged }}

{{- include "bjw-s.common.loader.init" . }}
{{ include "bjw-s.common.loader.generate" . }}
