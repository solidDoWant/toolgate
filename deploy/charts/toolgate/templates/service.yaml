apiVersion: v1
kind: Service
metadata:
  name: {{ include "toolgate.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "toolgate.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  selector:
    {{- include "toolgate.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: metrics
      port: {{ .Values.service.metricsPort }}
      targetPort: metrics
