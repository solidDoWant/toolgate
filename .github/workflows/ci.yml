name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists PR files via the API

# One group per branch. PRs: a newer push cancels the older run. master: the
# running run always finishes, and of the commits merged meanwhile only the
# newest waits. A cancelled *pending* master run is expected, not a failure.
# The acceptance phases the e2e-scoreboard job scores: every phase up to the
# current one. Add a phase here when it starts.
env:
  ACCEPTANCE_PHASES: "1 2 3 4"
  # GitHub runners are discarded after each job, so testcontainers' reaper
  # container (pulled from Docker Hub) isn't needed to clean up.
  TESTCONTAINERS_RYUK_DISABLED: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether anything that can affect build or test results changed.
  # Docs-only and agent-playbook-only pull requests skip every test job; the
  # required `checks` job below still runs and passes.
  #
  # Pushes to master always run everything. The concurrency group keeps only
  # the newest pending master run, so a docs-only commit merged behind a code
  # commit replaces the code commit's run, and a filter on the push diff
  # would then skip the tests of the code commit too. Running the full suite
  # on every master push means each master run tests everything merged so far.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'true' || steps.filter.outputs.code }}
      # The scoreboard's tests read the real checklist, so a checklist edit
      # runs just those tests (the scoreboard-tests job) and the docs checks.
      acceptance: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'true' || steps.filter.outputs.acceptance }}
      docs: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'true' || steps.filter.outputs.docs }}
      plugin: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && 'true' || steps.filter.outputs.plugin }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!*.md'
              - '!docs/**'
              - '!.claude/**'
              - '!LICENSE'
              - '!.github/renovate.json5'
              - '!.github/renovate/**'
            acceptance:
              - 'docs/acceptance/**'
            docs:
              - '{**/*.md,scripts/docs/**}'
            plugin:
              - '{plugin/**,.claude-plugin/**,scripts/plugin-check.sh,.github/workflows/ci.yml}'
            ui:
              - 'internal/ui/**'

  # The test tiers run as parallel jobs, inside the flake's dev shell, so CI
  # uses exactly the toolchain developers and agents use.
  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix-dev-shell
      - name: Lint
        run: nix develop -c make lint
      - name: Generated code is current
        run: nix develop -c make check-generate
      - name: Save Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/go-cache-save

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The test guard's own tests run it against this repository's history.
          fetch-depth: 0
      - uses: ./.github/actions/nix-dev-shell
      - name: Unit tests
        env:
          GO_TEST_JSON: build/acceptance/results/go-unit.json
        run: nix develop -c make test
      - name: Build
        run: nix develop -c make build
      - name: Upload the acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-results-unit
          path: build/acceptance/results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/go-cache-save

  integration:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix-dev-shell
      # The embeddings model of the tool search quality test (testutil.StartEmbeddings).
      - name: Cache the embeddings model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/toolgate-embeddings
          key: embeddings-model-bge-small
      - name: Integration tests
        env:
          GO_TEST_JSON: build/acceptance/results/go-integration.json
        run: nix develop -c make test-integration
      - name: Upload the acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-results-integration
          path: build/acceptance/results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Go caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/go-cache-save

  # kind on the runner's Docker (kind, kubectl, helm and flux come from the
  # dev shell). Each shard runs its share of the e2e tests, acceptance tests
  # included, on its own cluster (scripts/e2e/shard.py picks the tests);
  # e2e-scoreboard scores the results of the unit, integration and e2e jobs
  # together.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_SHARD: ${{ matrix.shard }}/3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix-dev-shell
      - name: e2e tests (shard ${{ matrix.shard }} of 3)
        run: nix develop -c ./scripts/e2e/run.sh ./scripts/ci/e2e.sh
      - name: Upload the acceptance results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-results-${{ matrix.shard }}
          path: build/acceptance/results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Go caches
        if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: ./.github/actions/go-cache-save

  # The acceptance scoreboard of the unit, integration and e2e jobs' results
  # (no test runs twice), as `make acceptance` prints it, in the job summary.
  # Plain runner Python, no Nix.
  e2e-scoreboard:
    needs: [unit, integration, e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acceptance-results-*
          merge-multiple: true
          path: build/acceptance/results
      - name: Acceptance scoreboard
        run: ./scripts/ci/e2e-scoreboard.sh build/acceptance/results

  # A checklist edit alone: only the scoreboard's tests read the checklist.
  scoreboard-tests:
    needs: changes
    if: needs.changes.outputs.acceptance == 'true' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scoreboard tests
        run: ./scripts/acceptance-scoreboard_test.py

  # The human-facing Markdown: links and anchors, agent-prose tells and the
  # page index fail the job; the style report is advisory and only goes to
  # the job summary.
  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base with the PR's base branch, for the style report.
          fetch-depth: 0
      - uses: ./.github/actions/nix-dev-shell
        with:
          go: 'false'
      - name: Links, agent prose and page index
        run: nix develop -c make docs-check
      - name: Style report (advisory)
        if: always() && github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: nix develop -c ./scripts/docs/style_report.sh "$BASE" >> "$GITHUB_STEP_SUMMARY"

  # The Claude Code plugin and marketplace manifests (scripts/plugin-check.sh),
  # checked with a pinned Claude Code from npm on the runner's Node, no Nix.
  plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLAUDE_CODE_VERSION: 2.1.318
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Validate and install the plugin
        run: make plugin-check

  # Fails a pull request that deletes or skips a checklist scenario test
  # (scripts/ci/test-guard.py), for every change, docs-only included. Plain
  # runner Python, no Nix: it takes seconds. The labels are read when the job
  # runs, so after the owner adds test-removal-approved, re-running this job
  # picks it up.
  test-guard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge base with the PR's base branch.
          fetch-depth: 0
      - name: No scenario test removed or skipped
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE: origin/${{ github.base_ref }}
        run: |
          TEST_GUARD_PR_LABELS="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name] | join(",")')"
          export TEST_GUARD_PR_LABELS
          make test-guard

  # Screenshots of every web UI page (make ui-screenshots), uploaded for a
  # person to review on pull requests that change the web UI.
  ui-screenshots:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/nix-dev-shell
      - name: Render the screenshots
        run: nix develop -c make ui-screenshots UI_SCREENSHOTS_DIR=build/ui-screenshots
      - name: Upload the screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: build/ui-screenshots/
          if-no-files-found: error
          retention-days: 30

  # The single required status check. It always runs, so docs-only changes
  # still produce a passing `checks`; it fails if any job failed or was
  # cancelled, and passes when each succeeded or was skipped.
  checks:
    needs: [changes, lint, unit, integration, e2e, e2e-scoreboard, scoreboard-tests, docs, plugin, test-guard, ui-screenshots]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "a required job ended with: $result" >&2; exit 1 ;;
            esac
          done
