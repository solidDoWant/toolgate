name: nix-dev-shell
description: >-
  Install Nix and restore the caches every Linux CI job needs: the Nix store
  (the flake's dev shell) and, for Go jobs, the Go module and build caches.
  Only restores the Go caches; jobs on master save them again with
  ./.github/actions/go-cache-save, so pull requests never save caches of
  their own and can't evict master's.
inputs:
  go:
    description: Restore the Go module and build caches.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
    - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
      with:
        primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-
    # Downloaded modules change only with go.sum.
    - id: gomod
      if: inputs.go == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
        restore-keys: gomod-${{ runner.os }}-
    # Compiled packages change with every commit and differ per job (-race,
    # build tags, lint), so each job restores its own, from the newest master
    # commit that saved one.
    - if: inputs.go == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: gobuild-${{ runner.os }}-${{ github.job }}-
    - if: inputs.go == 'true'
      shell: bash
      env:
        GOMOD_HIT: ${{ steps.gomod.outputs.cache-hit }}
      run: |
        echo "TOOLGATE_GOMOD_CACHE_HIT=${GOMOD_HIT:-false}" >> "$GITHUB_ENV"
        # go-cache-save trims build cache entries this job didn't use.
        echo "TOOLGATE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"
