{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · toolgate</title>
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false}'>
<link rel="stylesheet" href="/ui/static/toolgate.css">
<script src="/ui/static/htmx-2.0.7.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{.CSRFToken}}"}'>
<header class="site-header">
<span class="brand">toolgate</span>
<form method="post" action="/ui/logout" class="logout">
<input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
<span class="user">{{.User}}</span>
<button type="submit" class="secondary">Sign out</button>
</form>
</header>
<nav aria-label="Main">
<a href="/ui/servers"{{if eq .Section "servers"}} aria-current="page"{{end}}>Servers</a>
<a href="/ui/sessions"{{if eq .Section "sessions"}} aria-current="page"{{end}}>Sessions</a>
<a href="/ui/grants"{{if eq .Section "grants"}} aria-current="page"{{end}}>Grants</a>
<a href="/ui/approvals"{{if eq .Section "approvals"}} aria-current="page"{{end}}>Approvals</a>
<a href="/ui/workspaces"{{if eq .Section "workspaces"}} aria-current="page"{{end}}>Workspaces</a>
{{if .Secrets}}<a href="/ui/secrets"{{if eq .Section "secrets"}} aria-current="page"{{end}}>Secrets</a>
{{end}}<a href="/ui/audit"{{if eq .Section "audit"}} aria-current="page"{{end}}>Audit</a>
{{if .Admin}}<a href="/ui/blocks"{{if eq .Section "blocks"}} aria-current="page"{{end}}>Blocks</a>
{{end}}</nav>
<main>
<h1>{{.Title}}</h1>
{{template "content" .}}
</main>
</body>
</html>
{{end}}
