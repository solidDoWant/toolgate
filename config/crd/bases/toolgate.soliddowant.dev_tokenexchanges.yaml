---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: tokenexchanges.toolgate.soliddowant.dev
spec:
  group: toolgate.soliddowant.dev
  names:
    kind: TokenExchange
    listKind: TokenExchangeList
    plural: tokenexchanges
    singular: tokenexchange
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TokenExchange is an OAuth 2.0 token exchange (RFC 8693) that templates in
          the same namespace name in `${exchange:NAME}`. The gateway sends a user's
          access token to its tokenURL, so the URL must be on the gateway's
          allow-list for the resource to be valid.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TokenExchangeSpec says where and how the gateway exchanges
              a token.
            properties:
              audience:
                description: Audience is the RFC 8693 audience parameter.
                maxLength: 256
                type: string
              clientID:
                description: ClientID is the confidential client that exchanges tokens.
                maxLength: 256
                type: string
              clientSecretRef:
                description: |-
                  ClientSecretRef names the Secret key that holds the client secret,
                  in the template secrets namespace.
                properties:
                  key:
                    maxLength: 253
                    type: string
                  name:
                    maxLength: 253
                    type: string
                required:
                - key
                - name
                type: object
              requestedTokenType:
                description: RequestedTokenType is the RFC 8693 requested_token_type
                  URI.
                maxLength: 256
                type: string
              scope:
                description: Scope is a space-separated list of scopes.
                maxLength: 1024
                type: string
              timeout:
                description: 'Timeout bounds one exchange: a Go duration, default
                  10s, at most 60s.'
                type: string
              tokenURL:
                description: |-
                  TokenURL is the IdP's token endpoint, an https:// URL on the
                  gateway's allow-list.
                maxLength: 2048
                type: string
            required:
            - clientID
            - clientSecretRef
            - tokenURL
            type: object
          status:
            description: |-
              Status is the status every toolgate resource has: toolgate reports
              whether it accepted the resource, and why not, in its conditions.
            properties:
              conditions:
                description: Conditions report whether toolgate accepted the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
