---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: mcpservertemplates.toolgate.soliddowant.dev
spec:
  group: toolgate.soliddowant.dev
  names:
    kind: MCPServerTemplate
    listKind: MCPServerTemplateList
    plural: mcpservertemplates
    shortNames:
    - mcpt
    singular: mcpservertemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.scope
      name: Scope
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          MCPServerTemplate is one catalog entry: an MCP server toolgate can start
          for a session, a user or everyone. Its name is the server name.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: MCPServerTemplateSpec describes the server and who may use
              it.
            properties:
              access:
                description: Access lists who may see and enable the server.
                properties:
                  environments:
                    default: opt-in
                    description: |-
                      Environments says which attestation a request needs: any, opt-in
                      or attested. It defaults to opt-in.
                    type: string
                    x-kubernetes-validations:
                    - message: environments must be one of any, opt-in, attested
                      rule: self in ['any', 'opt-in', 'attested']
                  groups:
                    description: |-
                      Groups are glob patterns matched against each OIDC group of a user
                      identity. * matches any user with at least one group, not every user.
                    items:
                      maxLength: 256
                      type: string
                    maxItems: 1024
                    type: array
                  serviceAccounts:
                    description: ServiceAccounts are system:serviceaccount:<namespace>:<name>
                      names.
                    items:
                      maxLength: 320
                      type: string
                    maxItems: 1024
                    type: array
                  spiffeIDs:
                    description: |-
                      SPIFFEIDs are glob patterns, such as
                      spiffe://coder.example.com/owner/*/workspace/*, matched against the
                      SPIFFE ID of a JWT-SVID sign-in. Only SPIFFE identities match them.
                    items:
                      maxLength: 2048
                      type: string
                    maxItems: 64
                    type: array
                  users:
                    description: |-
                      Users are glob patterns matched against the OIDC subject and the
                      verified email of a user identity, such as alice@example.com,
                      *@example.com, or * for every signed-in user. Escape a literal *, ?,
                      [, ], {, } or \ with a backslash. Service accounts and SPIFFE
                      identities never match them.
                    items:
                      maxLength: 256
                      type: string
                    maxItems: 1024
                    type: array
                type: object
              declaredTools:
                description: |-
                  DeclaredTools is the admin's own list of the server's tools. It is
                  shown while no instance runs, and the gateway does not learn the
                  list from instances.
                items:
                  description: DeclaredTool is one tool of the server, as the admin
                    states it.
                  properties:
                    description:
                      description: Description is the tool's description.
                      maxLength: 4096
                      type: string
                    inputSchema:
                      description: InputSchema is the JSON Schema of the tool's input,
                        an object.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description: Name is the tool's own name.
                      maxLength: 128
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                maxItems: 512
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              description:
                description: Description is shown to users and the model in the catalog.
                maxLength: 1024
                type: string
              endpoint:
                description: |-
                  Endpoint is where the instance serves MCP. It is required unless
                  Remote is set.
                properties:
                  path:
                    default: /mcp
                    description: |-
                      Path is the HTTP path of the MCP endpoint. It defaults to /mcp; set / to
                      use the server root.
                    maxLength: 1024
                    type: string
                  port:
                    description: Port is the Service port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  service:
                    description: Service is the name of a Service among the template's
                      resources.
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - port
                - service
                type: object
              healthCheck:
                description: |-
                  HealthCheck is a custom HTTP check of a running instance. Without
                  it, only the MCP ping runs.
                properties:
                  failureThreshold:
                    default: 3
                    description: |-
                      FailureThreshold is the number of failures in a row that make the
                      instance unhealthy.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  http:
                    description: HTTP is the request to make.
                    properties:
                      expectedStatus:
                        default: 200
                        description: ExpectedStatus is the status that counts as a
                          pass.
                        format: int32
                        maximum: 599
                        minimum: 100
                        type: integer
                      path:
                        description: Path is the HTTP path. It is not rendered.
                        maxLength: 1024
                        type: string
                        x-kubernetes-validations:
                        - message: path must start with /
                          rule: self.startsWith('/')
                      port:
                        description: Port is the Service port.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      service:
                        description: |-
                          Service is the name of a Service among the template's resources. It
                          is rendered like endpoint.service.
                        maxLength: 63
                        minLength: 1
                        type: string
                    required:
                    - path
                    - port
                    - service
                    type: object
                  interval:
                    default: 30s
                    description: Interval is the time between checks.
                    type: string
                  maxRepairs:
                    default: 3
                    description: MaxRepairs is the number of repairs allowed within
                      30 minutes.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  onFailure:
                    default: replace
                    description: |-
                      OnFailure says how an unhealthy instance is repaired: replace,
                      reapply or none.
                    type: string
                    x-kubernetes-validations:
                    - message: onFailure must be one of replace, reapply, none
                      rule: self in ['replace', 'reapply', 'none']
                  successThreshold:
                    default: 1
                    description: |-
                      SuccessThreshold is the number of passes in a row that make the
                      instance healthy again.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  timeout:
                    default: 5s
                    description: Timeout is how long one check may take.
                    type: string
                required:
                - http
                type: object
                x-kubernetes-validations:
                - message: timeout must be less than interval
                  rule: duration(self.timeout) < duration(self.interval)
                - message: interval must be between 10s and 10m
                  rule: duration(self.interval) >= duration('10s') && duration(self.interval)
                    <= duration('10m')
                - message: timeout must be between 1s and 60s
                  rule: duration(self.timeout) >= duration('1s') && duration(self.timeout)
                    <= duration('60s')
              idleStop:
                description: |-
                  IdleStop is how long a per-user or shared instance runs with no
                  calls before it stops. 0 keeps a shared instance running.
                type: string
              namespace:
                default: per-instance
                description: |-
                  Namespace says where instances run: per-instance (each in its own
                  namespace) or shared (one configured namespace, effective scope
                  shared only).
                type: string
                x-kubernetes-validations:
                - message: namespace must be one of per-instance, shared
                  rule: self in ['per-instance', 'shared']
              remote:
                description: |-
                  Remote makes the template a remote server: toolgate starts nothing
                  and connects to an MCP server that already runs elsewhere. It
                  excludes endpoint, resources and healthCheck.
                properties:
                  headers:
                    additionalProperties:
                      type: string
                    description: |-
                      Headers are sent with every request, keyed by header name. Values
                      may use ${secret:NAME} and ${principal.*}, filled in for each user.
                    maxProperties: 32
                    type: object
                    x-kubernetes-validations:
                    - message: each header name must be at most 256 characters and
                        each value at most 4096
                      rule: self.all(key, size(key) <= 256 && size(self[key]) <= 4096)
                  timeout:
                    description: Timeout bounds each request to the server, 1s to
                      5m.
                    type: string
                    x-kubernetes-validations:
                    - message: timeout must be between 1s and 5m
                      rule: duration(self) >= duration('1s') && duration(self) <=
                        duration('5m')
                  url:
                    description: |-
                      URL is the server's Streamable HTTP endpoint: https://, or http://
                      only to a cluster-internal host (ending in .svc or
                      .svc.cluster.local).
                    maxLength: 2048
                    minLength: 1
                    type: string
                required:
                - url
                type: object
              resources:
                description: Resources are the Kubernetes objects applied for each
                  instance.
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                maxItems: 64
                type: array
              scope:
                description: |-
                  Scope says who shares an instance: per-session, per-user or shared.
                  When it is unset, toolgate uses the broadest scope the template's
                  variables allow. When it is set, it must be that scope or narrower.
                type: string
                x-kubernetes-validations:
                - message: scope must be one of per-session, per-user, shared
                  rule: self in ['per-session', 'per-user', 'shared']
              start:
                default: onCall
                description: |-
                  Start says when an instance starts: onCall (the default) when a call
                  needs it, or onEnable when a session enables the server.
                type: string
                x-kubernetes-validations:
                - message: start must be one of onCall, onEnable
                  rule: self in ['onCall', 'onEnable']
              startTimeout:
                description: StartTimeout is how long an instance may take to become
                  ready.
                type: string
              toolFilter:
                description: |-
                  ToolFilter hides tools: it lists the upstream names to expose
                  (allow) or to hide (deny).
                properties:
                  allow:
                    description: Allow lists the upstream names exposed. Every other
                      tool is hidden.
                    items:
                      maxLength: 128
                      type: string
                    maxItems: 512
                    type: array
                  deny:
                    description: Deny lists the upstream names hidden.
                    items:
                      maxLength: 128
                      type: string
                    maxItems: 512
                    type: array
                type: object
                x-kubernetes-validations:
                - message: set exactly one of allow and deny
                  rule: has(self.allow) != has(self.deny)
              tools:
                additionalProperties:
                  description: ToolOverride changes the policy for one tool of a server.
                  properties:
                    approval:
                      description: |-
                        Approval set to required makes each call wait for a person's
                        approval.
                      type: string
                      x-kubernetes-validations:
                      - message: approval must be required or omitted
                        rule: self == 'required'
                    blocked:
                      description: Blocked refuses every call to the tool.
                      type: boolean
                    description:
                      description: Description replaces the tool's description.
                      maxLength: 4096
                      type: string
                    environments:
                      description: Environments overrides the server's access.environments
                        for this tool.
                      type: string
                      x-kubernetes-validations:
                      - message: environments must be one of any, opt-in, attested
                        rule: self in ['any', 'opt-in', 'attested']
                    inputDescriptions:
                      additionalProperties:
                        type: string
                      description: |-
                        InputDescriptions maps a top-level property of the tool's input
                        schema to the description it gets.
                      maxProperties: 64
                      type: object
                      x-kubernetes-validations:
                      - message: each input description must be at most 4096 characters
                        rule: self.all(key, size(self[key]) <= 4096)
                    name:
                      description: Name is the name the tool is exposed under, instead
                        of its own.
                      maxLength: 128
                      pattern: ^[A-Za-z0-9_.-]{1,128}$
                      type: string
                  type: object
                description: Tools holds per-tool overrides, keyed by the tool's own
                  name.
                maxProperties: 256
                type: object
              updatePolicy:
                description: |-
                  UpdatePolicy says when toolgate replaces running instances that were
                  started from an older version of the template. The default, manual,
                  replaces them only when a user or admin restarts them, or when they
                  stop.
                properties:
                  idleFor:
                    description: |-
                      IdleFor is how long an instance must have had no calls before
                      whenIdle replaces it. At least one minute.
                    type: string
                  mode:
                    description: |-
                      Mode is manual (the default), immediate or whenIdle. With immediate,
                      toolgate replaces every outdated instance as soon as the template
                      changes. With whenIdle, it replaces an outdated instance once it has
                      had no calls for idleFor and no call is running.
                    type: string
                    x-kubernetes-validations:
                    - message: mode must be one of manual, immediate, whenIdle
                      rule: self in ['manual', 'immediate', 'whenIdle']
                required:
                - mode
                type: object
                x-kubernetes-validations:
                - message: idleFor is required with mode whenIdle and not allowed
                    otherwise
                  rule: 'self.mode == ''whenIdle'' ? has(self.idleFor) : !has(self.idleFor)'
            type: object
            x-kubernetes-validations:
            - message: 'namespace: shared is allowed only with scope: shared'
              rule: '!has(self.__namespace__) || self.__namespace__ != ''shared''
                || !has(self.scope) || self.scope == ''shared'''
            - message: remote cannot be set together with endpoint, resources or healthCheck
              rule: '!has(self.remote) || (!has(self.endpoint) && !has(self.resources)
                && !has(self.healthCheck))'
            - message: endpoint is required unless remote is set
              rule: has(self.remote) || has(self.endpoint)
          status:
            description: |-
              Status is the status every toolgate resource has: toolgate reports
              whether it accepted the resource, and why not, in its conditions.
            properties:
              conditions:
                description: Conditions report whether toolgate accepted the resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the name is the server name and must match ^[a-z][a-z0-9-]{0,30}$
          rule: self.metadata.name.matches('^[a-z][a-z0-9-]{0,30}$')
    served: true
    storage: true
    subresources:
      status: {}
