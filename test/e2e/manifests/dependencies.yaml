# The gateway's dependencies in the e2e cluster: PostgreSQL, an S3 server and
# an OCI registry for the test chart. scripts/e2e/run.sh sets the images of
# PostgreSQL and S3 (the ones internal/testutil pins) and creates the Secret
# `dependencies` with the credentials before applying this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres
          env:
            - {name: POSTGRES_USER, value: toolgate}
            - {name: POSTGRES_DB, value: toolgate}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: dependencies, key: postgres-password}}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, toolgate, -d, toolgate]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  selector:
    matchLabels: {app: s3}
  template:
    metadata:
      labels: {app: s3}
    spec:
      containers:
        - name: s3
          image: versitygw
          command: [sh, -c, "mkdir -p /data /meta && exec versitygw --port :7070 posix --sidecar /meta /data"]
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: dependencies, key: s3-access-key}}
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: dependencies, key: s3-secret-key}}
          ports:
            - {name: s3, containerPort: 7070}
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: {app: s3}
  ports:
    - {name: s3, port: 7070, targetPort: s3}
---
# The OCI registry that holds the test chart (test/e2e/charts/mcpserver).
# run.sh pushes the chart through a port-forward; Flux pulls it through the
# Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      containers:
        - name: registry
          image: registry:3@sha256:d4032d4cc323c1731c707931ecada07a53076eac38e3b61ae57533f170f2c6c3
          ports:
            - {name: registry, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /v2/, port: registry}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  selector: {app: registry}
  ports:
    - {name: registry, port: 5000, targetPort: registry}
