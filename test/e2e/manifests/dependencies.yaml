# The gateway's dependencies in the e2e cluster: PostgreSQL, an S3 server and
# an OCI registry for the test chart. scripts/e2e/run.sh sets the images of
# PostgreSQL and S3 (the ones internal/testutil pins) and creates the Secret
# `dependencies` with the credentials before applying this.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie@sha256:4d0aac315c4d8c3202252bd06fea83b16951cc57234a7b610eeaa382ff4482d0
          # The image has no entrypoint script: create the cluster and the
          # database on first start, then run the server.
          command:
            - sh
            - -c
            - |
              set -eu
              export PGDATA=/tmp/pgdata PGHOST=/tmp
              printf '%s' "$POSTGRES_PASSWORD" > /tmp/pwfile
              initdb -D "$PGDATA" -U toolgate --pwfile=/tmp/pwfile --auth-local=trust --auth-host=trust >/dev/null
              rm /tmp/pwfile
              # Loopback is trusted (the harness runs psql in this pod); other hosts need the password.
              echo 'host all all all scram-sha-256' >> "$PGDATA/pg_hba.conf"
              pg_ctl -D "$PGDATA" -w -o "-c listen_addresses='' -c unix_socket_directories=/tmp" start >/dev/null
              createdb -U toolgate toolgate
              pg_ctl -D "$PGDATA" -w stop >/dev/null
              exec postgres -D "$PGDATA" -c listen_addresses='*' -c unix_socket_directories=/tmp
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: dependencies, key: postgres-password}}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -U, toolgate, -d, toolgate]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  selector:
    matchLabels: {app: s3}
  template:
    metadata:
      labels: {app: s3}
    spec:
      containers:
        - name: s3
          image: ghcr.io/versity/versitygw:v1.10.0@sha256:89cad13cc981986ee284cbafea4613f9533ce6fd5f37a2c96c4c4fb8adb3a316
          command: [sh, -c, "mkdir -p /data /meta && exec versitygw --port :7070 posix --sidecar /meta /data"]
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: dependencies, key: s3-access-key}}
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: dependencies, key: s3-secret-key}}
          ports:
            - {name: s3, containerPort: 7070}
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector: {app: s3}
  ports:
    - {name: s3, port: 7070, targetPort: s3}
---
# The OCI registry that holds the test chart (test/e2e/charts/mcpserver).
# run.sh pushes the chart through a port-forward; Flux pulls it through the
# Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      containers:
        - name: registry
          image: ghcr.io/distribution/distribution:3.1.2@sha256:d106962e6fe3fa69c178cec77eeeee5edb626b8df6535b7bd6b95e658a0a5ca9
          ports:
            - {name: registry, containerPort: 5000}
          readinessProbe:
            httpGet: {path: /v2/, port: registry}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: registry
spec:
  selector: {app: registry}
  ports:
    - {name: registry, port: 5000, targetPort: registry}
