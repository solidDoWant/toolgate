# image is the test MCP server image. The chart refuses to install without
# it, so a HelmRelease that leaves it out fails to install.
image: ""
# tools are the tool names the server lists.
tools: env,secrets
# dataClaim is the name of a PersistentVolumeClaim to mount at /data. The
# server's write_note and read_note tools use it. Empty mounts nothing.
dataClaim: ""
