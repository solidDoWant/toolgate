# Runs the shared pull request Pipeline (infra-mk3's
# cluster/gitops/ci/tekton/pipelines) with this repository's ci.yaml.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  # A fixed name collides with the previous run, which Pipelines-as-Code keeps.
  generateName: toolgate-pull-request-
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: >-
      event == "pull_request" && target_branch == "master" && body.action != "ready_for_review"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
spec:
  pipelineRef:
    resolver: cluster
    params:
      - name: kind
        value: pipeline
      - name: name
        value: ci-pull-request
      - name: namespace
        value: ci-tekton
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: repo
      value: "{{ repo_owner }}/{{ repo_name }}"
    - name: pull_request_number
      value: "{{ pull_request_number }}"
  timeouts:
    pipeline: 1h
  workspaces:
    - name: source
      emptyDir: {}
  taskRunSpecs:
    - pipelineTaskName: labels
      serviceAccountName: ci-report
    - pipelineTaskName: report
      serviceAccountName: ci-report
    # Every stage runs inside the dind sidecar's cgroup, so its memory is the
    # memory of all stages together: 1.5 times the measured peak (the stage
    # table prints it). No CPU limit; the request is the stages' CPU budget.
    - pipelineTaskName: ci
      sidecarSpecs:
        - name: dind
          computeResources:
            requests:
              cpu: "8"
              memory: 20Gi
            limits:
              memory: 20Gi
      stepSpecs:
        - name: run
          computeResources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 256Mi
