openapi: 3.1.0
info:
  title: toolgate gateway API
  version: v1
paths:
  /api/v1/access-requests/{id}:
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          pattern: ^[0-9a-f]{32}$
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesapiAccessRequest'
          description: OK
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Not Found
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Read one of the caller's access requests
  /api/v1/admin/volumes:
    get:
      parameters:
      - description: Only the per-user volumes of this principal.
        in: query
        name: owner
        schema:
          description: Only the per-user volumes of this principal.
          type: string
      - description: Continue after this volume ID (the next value of the previous
          page).
        in: query
        name: after
        schema:
          description: Continue after this volume ID (the next value of the previous
            page).
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumesapiList'
          description: OK
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: List the persistent volumes (admins only)
  /api/v1/admin/volumes/{id}:
    delete:
      parameters:
      - description: The volume ID.
        in: path
        name: id
        required: true
        schema:
          description: The volume ID.
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumesapiVolume'
          description: Accepted
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Not Found
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Mark a persistent volume for deletion (admins only); the leader deletes
        it
  /api/v1/audit/tail:
    get:
      parameters:
      - description: Continue after this event key (the key of the last event received).
        in: query
        name: after
        schema:
          description: Continue after this event key (the key of the last event received).
          type: string
      responses:
        "200":
          content:
            application/x-ndjson:
              schema:
                $ref: '#/components/schemas/AudittailEvent'
          description: OK
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "429":
          content:
            text/plain:
              schema:
                type: string
          description: Too Many Requests
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Stream the audit events the caller may see, as NDJSON, following new
        ones
  /api/v1/secrets:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretsSecretList'
          description: OK
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
      summary: 'List the caller''s secrets: names and dates only'
  /api/v1/secrets/{name}:
    delete:
      parameters:
      - in: path
        name: name
        required: true
        schema:
          pattern: ^[A-Za-z0-9._][A-Za-z0-9._-]{0,127}$
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Not Found
      summary: Delete one of the caller's secrets
    put:
      parameters:
      - in: path
        name: name
        required: true
        schema:
          pattern: ^[A-Za-z0-9._][A-Za-z0-9._-]{0,127}$
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecretsSecretInfo'
          description: OK
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "413":
          content:
            text/plain:
              schema:
                type: string
          description: Request Entity Too Large
      summary: Store the request body as a secret's value
  /api/v1/sessions:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionsapiList'
          description: OK
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: List the caller's open sessions and their enabled servers
  /api/v1/settings:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Get the merged Claude Code settings that match the caller
  /api/v1/workspace-keys:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesapiWorkspaceKeyList'
          description: OK
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: List the caller's active workspace keys and pending key requests
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacesapiKeyRegistration'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesapiKeyActive'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesapiKeyRequested'
          description: Accepted
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: Forbidden
        "409":
          content:
            text/plain:
              schema:
                type: string
          description: Conflict
        "413":
          content:
            text/plain:
              schema:
                type: string
          description: Request Entity Too Large
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Register a workspace key; it becomes a key access request that the
        user approves in the web UI
  /api/v1/workspace-keys/{name}:
    delete:
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesapiKeyRevoked'
          description: OK
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Not Found
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Revoke the caller's workspace key and deny its pending key requests
  /api/v1/workspaces:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesapiList'
          description: OK
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "409":
          content:
            text/plain:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: List the caller's workspace defaults and lists
  /api/v1/workspaces/changes:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspacesapiChange'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesapiApplied'
          description: OK
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspacesapiRequested'
          description: Accepted
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: Bad Request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Unauthorized
        "403":
          content:
            text/plain:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/plain:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/plain:
              schema:
                type: string
          description: Conflict
        "413":
          content:
            text/plain:
              schema:
                type: string
          description: Request Entity Too Large
        "500":
          content:
            text/plain:
              schema:
                type: string
          description: Internal Server Error
      summary: Change the caller's workspace lists or defaults; a widening change
        becomes an access request
components:
  schemas:
    AudittailEvent:
      properties:
        attestation:
          type: string
        details: {}
        key:
          type: string
        occurredAt:
          format: date-time
          type: string
        principal:
          type: string
        requestId:
          type: string
        server:
          type: string
        session:
          type: string
        tool:
          type: string
        traceId:
          type: string
        type:
          type: string
        workspace:
          type: string
      type: object
    SecretsSecretInfo:
      properties:
        createdAt:
          format: date-time
          type: string
        name:
          type: string
        updatedAt:
          format: date-time
          type: string
      type: object
    SecretsSecretList:
      properties:
        secrets:
          items:
            $ref: '#/components/schemas/SecretsSecretInfo'
          type:
          - array
          - "null"
      type: object
    SessionsapiList:
      properties:
        sessions:
          items:
            $ref: '#/components/schemas/SessionsapiSession'
          type:
          - array
          - "null"
        truncated:
          type: boolean
      type: object
    SessionsapiServer:
      properties:
        enabledAt:
          format: date-time
          type: string
        name:
          type: string
      type: object
    SessionsapiSession:
      properties:
        allowed:
          items:
            type: string
          type:
          - array
          - "null"
        attestation:
          type: string
        createdAt:
          format: date-time
          type: string
        denied:
          items:
            type: string
          type:
          - array
          - "null"
        lastSeenAt:
          format: date-time
          type: string
        servers:
          items:
            $ref: '#/components/schemas/SessionsapiServer'
          type:
          - array
          - "null"
        session:
          type: string
        workspace:
          type: string
      type: object
    VolumesapiList:
      properties:
        next:
          type: string
        volumes:
          items:
            $ref: '#/components/schemas/VolumesapiVolume'
          type:
          - array
          - "null"
      type: object
    VolumesapiVolume:
      properties:
        createdAt:
          format: date-time
          type: string
        deleteReason:
          type: string
        id:
          type: string
        inUseBy:
          type:
          - "null"
          - string
        lastUsedAt:
          format: date-time
          type: string
        owner:
          type: string
        persistentVolume:
          type:
          - "null"
          - string
        problem:
          type: string
        scope:
          type: string
        server:
          type: string
        sizeBytes:
          format: int64
          type: integer
        storageClass:
          type: string
        templateNamespace:
          type: string
        volume:
          type: string
      type: object
    WorkspacesapiAccessRequest:
      properties:
        expiresAt:
          format: date-time
          type: string
        id:
          type: string
        status:
          enum:
          - pending
          - approved
          - denied
          - expired
          type: string
      type: object
    WorkspacesapiApplied:
      properties:
        applied:
          type: boolean
      type: object
    WorkspacesapiChange:
      properties:
        action:
          enum:
          - allow
          - deny
          - clear
          - defaults
          type: string
        servers:
          items:
            type: string
          type: array
        session:
          type: string
        unverified:
          $ref: '#/components/schemas/WorkspacesapiUnverified'
        verified:
          enum:
          - none
          - all
          type: string
        workspace:
          type: string
      type: object
    WorkspacesapiDefaults:
      properties:
        unverified:
          enum:
          - none
          - all
          - list
          type: string
        unverifiedServers:
          items:
            type: string
          type:
          - array
          - "null"
        verified:
          enum:
          - none
          - all
          type: string
      type: object
    WorkspacesapiKeyActive:
      properties:
        fingerprint:
          type: string
        name:
          type: string
        status:
          enum:
          - active
          type: string
        workspace:
          type: string
      type: object
    WorkspacesapiKeyRegistration:
      properties:
        name:
          pattern: ^[A-Za-z0-9._-]{1,63}$
          type: string
        publicKey:
          type: string
      type: object
    WorkspacesapiKeyRequested:
      properties:
        fingerprint:
          type: string
        name:
          type: string
        replaces:
          type:
          - "null"
          - string
        request:
          type: string
        url:
          type: string
        workspace:
          type: string
      type: object
    WorkspacesapiKeyRevoked:
      properties:
        deniedRequests:
          type: integer
        revoked:
          type: boolean
      type: object
    WorkspacesapiList:
      properties:
        current:
          type:
          - "null"
          - string
        defaults:
          $ref: '#/components/schemas/WorkspacesapiDefaults'
        workspaces:
          items:
            $ref: '#/components/schemas/WorkspacesapiWorkspace'
          type:
          - array
          - "null"
      type: object
    WorkspacesapiRequested:
      properties:
        request:
          type: string
        url:
          type: string
      type: object
    WorkspacesapiUnverified:
      oneOf:
      - type: boolean
      - $ref: '#/components/schemas/WorkspacesapiUnverifiedDefault'
    WorkspacesapiUnverifiedDefault:
      enum:
      - none
      - all
      - list
      type: string
    WorkspacesapiWorkspace:
      properties:
        denied:
          items:
            type: string
          type:
          - array
          - "null"
        servers:
          items:
            type: string
          type:
          - array
          - "null"
        tools:
          items:
            type: string
          type:
          - array
          - "null"
        updatedAt:
          format: date-time
          type: string
        workspace:
          type: string
      type: object
    WorkspacesapiWorkspaceKey:
      properties:
        approvedAt:
          format: date-time
          type:
          - "null"
          - string
        fingerprint:
          type: string
        lastUsedAt:
          format: date-time
          type:
          - "null"
          - string
        name:
          type: string
        registeredAt:
          format: date-time
          type: string
        request:
          type:
          - "null"
          - string
        status:
          enum:
          - active
          - pending
          type: string
        workspace:
          type: string
      type: object
    WorkspacesapiWorkspaceKeyList:
      properties:
        enabled:
          type: boolean
        keys:
          items:
            $ref: '#/components/schemas/WorkspacesapiWorkspaceKey'
          type:
          - array
          - "null"
      type: object
